version: 2.1

jobs:
  p2_dotnet8-test:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Flush temp bucket
          command: |
            mkdir -p /tmp/_bld
            set +o pipefail 2>/dev/null; head -c 1250379 /dev/urandom | base64 > /tmp/_bld/12.log; true
            echo "baseline emitted ($(wc -l </tmp/_bld/12.log) lines)"
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - 12.log
  dotnet8-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Fetch previous
          command: |
            wc -l /tmp/_bld/12.log || true
      - run:
          name: Get project
          command: git clone --depth 2 --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: zcat static.tgz | tar xvf -
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Smoke check
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Collect artifacts
          command: /bin/sleep 30
      - run:
          no_output_timeout: 88m
          command: env ./run-task
  staging_tb-alt:
    docker:
      - image: cimg/base:current
